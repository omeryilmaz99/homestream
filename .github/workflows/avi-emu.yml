name: AVI emulator probe

on:
  push:
    branches: ['ci/emu-avi']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Make AVI test files
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p ci/avi/files
          # typical Xvid + MP3 rip with B-frames
          ffmpeg -v error -y -f lavfi -i mandelbrot=size=720x400:rate=24 -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 90 -c:v libxvid -b:v 1800k -bf 2 -g 250 -c:a libmp3lame -b:a 128k -ac 2 ci/avi/files/xvid.avi
          # badly interleaved: audio stored ~8 s away from its video
          ffmpeg -v error -y -f lavfi -i mandelbrot=size=720x400:rate=24 -itsoffset 8 -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 90 -c:v libxvid -b:v 1800k -bf 2 -g 250 -c:a libmp3lame -b:a 128k -ac 2 ci/avi/files/badint.avi
          ls -la ci/avi/files
          cd ci/avi && go build -o serve serve.go && (nohup ./serve -dir files -latency 30ms > server.log 2>&1 &) && sleep 1 && curl -sI http://127.0.0.1:8431/xvid.avi | head -3
      - name: Build probe APK
        working-directory: client
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-x64 -t lib/avi_probe.dart
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash ci/avi/run.sh client/build/app/outputs/flutter-apk/app-release.apk
      - name: Publish results
        if: always()
        run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan emu-avi-results
          git rm -rf --cached . >/dev/null
          mkdir -p r; cp -r emu-out/* r/ 2>/dev/null || true
          git add -f r
          git commit -m "avi probe results $GITHUB_RUN_ID" >/dev/null
          git push -f origin HEAD:refs/heads/ci/emu-avi-results
