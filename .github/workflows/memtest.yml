name: Memory test (Windows)

on:
  push:
    branches: ['memtest/**']
  workflow_dispatch:

jobs:
  memtest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: profile-emoji, screen: profile, variant: anim, avatars: emoji, noimpeller: '0' }
          - { name: profile-letters, screen: profile, variant: anim, avatars: letters, noimpeller: '0' }
          - { name: profile-static, screen: profile, variant: static, avatars: emoji, noimpeller: '0' }
          - { name: profile-noimpeller, screen: profile, variant: anim, avatars: emoji, noimpeller: '1' }
          - { name: home, screen: home, variant: anim, avatars: emoji, noimpeller: '0' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Start test server
        shell: pwsh
        run: |
          cd server
          $env:CGO_ENABLED = "0"
          go build -o $env:RUNNER_TEMP\hs-server.exe .
          $lib = "$env:RUNNER_TEMP\lib\HomeStream"
          New-Item -ItemType Directory -Force "$lib\Filmler", "$lib\Diziler\Test Dizi\Sezon 1" | Out-Null
          $names = @("Filmler\Inception (2010).mkv", "Filmler\Matrix (1999).mkv", "Filmler\Interstellar (2014).mkv",
                     "Filmler\Esaretin Bedeli (1994).mkv", "Filmler\Gezegenimiz (2019).mkv",
                     "Diziler\Test Dizi\Sezon 1\Test Dizi S01E01.mkv", "Diziler\Test Dizi\Sezon 1\Test Dizi S01E02.mkv")
          $buf = New-Object byte[] (2MB)
          foreach ($n in $names) {
            [IO.File]::WriteAllBytes("$lib\$n", $buf)
            (Get-Item "$lib\$n").LastWriteTime = (Get-Date).AddDays(-2)
          }
          Start-Process -FilePath "$env:RUNNER_TEMP\hs-server.exe" -ArgumentList "--port","8420","--data","$env:RUNNER_TEMP\data","--library","$lib","--name","CI" -RedirectStandardOutput "$env:RUNNER_TEMP\server.log" -RedirectStandardError "$env:RUNNER_TEMP\server.err"
          Start-Sleep 8
          Invoke-RestMethod http://127.0.0.1:8420/api/info | ConvertTo-Json
          if ("${{ matrix.avatars }}" -eq "emoji") { $a1 = "😎"; $a2 = "🦊" } else { $a1 = ""; $a2 = "" }
          $b1 = [Text.Encoding]::UTF8.GetBytes((@{name="Omer";color="#8B5CF6";avatar=$a1} | ConvertTo-Json -Compress))
          $b2 = [Text.Encoding]::UTF8.GetBytes((@{name="Misafir";color="#10B981";avatar=$a2} | ConvertTo-Json -Compress))
          Invoke-RestMethod -Method Post http://127.0.0.1:8420/api/profiles -Body $b1 -ContentType 'application/json; charset=utf-8'
          Invoke-RestMethod -Method Post http://127.0.0.1:8420/api/profiles -Body $b2 -ContentType 'application/json; charset=utf-8'
          Start-Sleep 5
          Invoke-RestMethod http://127.0.0.1:8420/api/info | ConvertTo-Json

      - name: Build client
        working-directory: client
        run: |
          flutter pub get
          flutter build windows --release --dart-define=HS_TEST_SERVER=http://127.0.0.1:8420 --dart-define=HS_TEST_SCREEN=${{ matrix.screen }} --dart-define=HS_TEST_VARIANT=${{ matrix.variant }} --dart-define=HS_TEST_FRAMELOG=$env:RUNNER_TEMP\\frames.txt

      - name: Run and sample memory
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            New-Item -ItemType Directory -Force shots | Out-Null
            $bmp.Save("shots\$name.png")
          }
          if ("${{ matrix.noimpeller }}" -eq "1") { $env:FLUTTER_ENGINE_SWITCHES = "1"; $env:FLUTTER_ENGINE_SWITCH_1 = "enable-impeller=false" }
          $dll = "client\build\windows\x64\runner\Release\flutter_windows.dll"
          "impeller strings in dll: " + ((Select-String -Path $dll -Pattern "enable-impeller|FLUTTER_ENGINE_SWITCHES" -AllMatches -Encoding ascii | ForEach-Object { $_.Matches.Value } | Sort-Object -Unique) -join ", ")
          $p = Start-Process -FilePath client\build\windows\x64\runner\Release\HomeStream.exe -PassThru
          "sec,privateMB,workingSetMB,frames" | Tee-Object -FilePath mem.csv
          for ($i = 0; $i -le 300; $i += 10) {
            Start-Sleep 10
            $p.Refresh()
            if ($p.HasExited) { "exited with $($p.ExitCode)"; break }
            $fr = Get-Content "$env:RUNNER_TEMP\frames.txt" -ErrorAction SilentlyContinue
            "MEM {0},{1:N0},{2:N0},{3}" -f ($i + 10), ($p.PrivateMemorySize64 / 1MB), ($p.WorkingSet64 / 1MB), $fr | Tee-Object -FilePath mem.csv -Append
            if ($i -eq 20) { Shot "early" }
          }
          Shot "late"
          $bmp = [System.Drawing.Bitmap]::FromFile("$PWD\shots\late.png")
          $sum = 0; $n = 0
          for ($x = 0; $x -lt $bmp.Width; $x += 40) { for ($y = 0; $y -lt $bmp.Height; $y += 40) { $c = $bmp.GetPixel($x, $y); $sum += $c.R + $c.G + $c.B; $n++ } }
          "screenshot mean brightness: " + [math]::Round($sum / (3 * $n), 1)
          Get-Process HomeStream -ErrorAction SilentlyContinue | Format-Table Id, MainWindowTitle, Responding
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memtest-${{ matrix.name }}
          path: |
            mem.csv
            shots/*
