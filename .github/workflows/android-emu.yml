name: Android emulator check

on:
  push:
    branches: ['ci/emu']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build APK (with x86_64 for the emulator)
        working-directory: client
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64,android-x64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash ci/emu-test.sh client/build/app/outputs/flutter-apk/app-release.apk
      - name: Publish results
        if: always()
        run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan emu-results
          git rm -rf --cached . >/dev/null
          mkdir -p r; cp -r emu-out/* r/ 2>/dev/null || true
          git add -f r
          git commit -m "emulator results $GITHUB_RUN_ID" >/dev/null
          git push -f origin HEAD:refs/heads/ci/emu-results
