name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Test
        working-directory: server
        run: go test ./...
      - name: Build
        working-directory: server
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: |
            server/dist/*
            server/install.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        working-directory: client
        run: |
          flutter pub get
          flutter build windows --release
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path client/build/windows/x64/runner/Release/* -DestinationPath dist/HomeStream-Windows-Portable.zip
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" client/installer/homestream.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build APK
        working-directory: client
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm,android-arm64
          mkdir -p ../dist
          # one APK for both: it detects TV or phone at start
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/HomeStream-AndroidTV.apk
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/HomeStream-Android.apk
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  music-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze
        working-directory: music
        run: |
          flutter pub get
          flutter analyze
      - name: Build APK
        working-directory: music
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/HomeMuzik-Android.apk
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: music-android
          path: dist/*

  files-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze
        working-directory: files
        run: |
          flutter pub get
          flutter analyze
      - name: Build APK
        working-directory: files
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/HomeDosya-Android.apk
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: files-android
          path: dist/*

  files-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        working-directory: files
        run: |
          flutter pub get
          flutter build windows --release
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path files/build/windows/x64/runner/Release/* -DestinationPath dist/HomeDosya-Windows-Portable.zip
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" files/installer/homedosya.iss
      - uses: actions/upload-artifact@v4
        with:
          name: files-windows
          path: dist/*

  release:
    # only from main / tags: branches and pull requests just build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    needs: [server, windows, android, music-android, files-android, files-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Collect files
        run: |
          mkdir -p release
          find out -type f \( -name 'homestream-server-*' -o -name 'install.sh' -o -name '*.exe' -o -name '*.zip' -o -name '*.apk' \) -exec cp {} release/ \;
          ls -la release
      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Home Stream (son sürüm)
          prerelease: false
          make_latest: true
          files: release/*
