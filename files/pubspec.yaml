name: homestream_files
description: "Home Dosya - bilgisayar/telefon ile ev sunucusu arasında dosya aktarımı"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  crypto: ^3.0.8
  provider: ^6.1.5+1
  permission_handler: ^12.0.1
  desktop_drop: ^0.8.4
  open_filex: ^5.0.0
  device_info_plus: ^12.4.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
